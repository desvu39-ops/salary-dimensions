[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salary-dimensions"
version = "0.1.0"
description = "Parse Chinese job salary expressions into structured fields"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Your Name"}]
keywords = ["salary", "parsing", "chinese", "recruitment", "excel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
